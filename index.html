<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Mock Interviewer</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--txt:#e8ecf4;--mut:#8b96ad;--acc:#4f8cff;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Segoe UI,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
button.sec{background:#2a3350}button.end{background:var(--bad)}button:disabled{opacity:.4;cursor:default}
.pill{background:var(--card);border-radius:999px;padding:5px 12px;color:var(--mut)}
.pill b{color:var(--txt)}
#status.on{color:var(--ok)}#status.err{color:var(--bad)}
#log{background:var(--card);border-radius:12px;padding:14px;height:56vh;overflow:auto}
.m{margin:0 0 10px}.m .who{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.m.agent .t{color:#cfe0ff}.m.user .t{color:var(--txt)}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:640px){.setup{grid-template-columns:1fr}}
.setup label{display:block;font-weight:600;margin-bottom:4px}
.setup textarea{width:100%;height:130px;background:var(--card);color:var(--txt);border:1px solid #2a3350;border-radius:8px;padding:8px;font:13px/1.4 Consolas,monospace;resize:vertical}
.setup .hint{color:var(--mut);font-size:12px;margin-top:3px}
.setup input[type=file]{color:var(--mut);font-size:12px;margin-bottom:4px}
.bar{display:inline-block;vertical-align:middle;height:6px;background:#2a3350;border-radius:3px;overflow:hidden;width:140px}.bar i{display:block;height:100%;width:0;background:var(--ok)}
</style></head><body><main>
<h1>Voice Mock Interviewer</h1>
<p class="sub">Add your resume and a job description, then answer spoken questions tailored to the role. Use headphones; talk over the interviewer to interrupt.</p>
<div class="setup" id="setup">
  <div><label for="resume">Resume</label>
    <input type="file" id="resumeFile" accept=".pdf,.docx,.txt,.md">
    <textarea id="resume" placeholder="Upload a file or paste your resume text"></textarea>
    <div class="hint" id="resumeHint"></div></div>
  <div><label for="jd">Job description</label>
    <input type="file" id="jdFile" accept=".pdf,.docx,.txt,.md">
    <textarea id="jd" placeholder="Upload a file or paste the job description"></textarea>
    <div class="hint" id="jdHint"></div></div>
</div>
<div class="row">
  <button id="start">Start interview</button>
  <button id="end" class="sec end" disabled>End and get feedback</button>
  <button id="stop" class="sec" disabled>Stop now</button>
  <span class="pill">Status: <b id="status">idle</b></span>
  <span class="pill">Mic <span class="bar"><i id="lvl"></i></span></span>
</div>
<div class="row">
  <span class="pill">Last turn latency: <b id="lat">-</b></span>
  <span class="pill">Median: <b id="med">-</b></span>
  <span class="pill">p95: <b id="p95">-</b></span>
  <span class="pill">Turns: <b id="n">0</b></span>
</div>
<div id="log"></div>
</main>
<script>
const $=id=>document.getElementById(id);
let ws,micCtx,outCtx,stream,node,nextT=0,sources=[],lats=[];
let lastSpeech=0,awaiting=false,ending=false,fbStarted=false,endTimer=null,closed=true;
const SPEECH_RMS=0.02;

function setStatus(t,c){const s=$('status');s.textContent=t;s.className=c||''}
function add(role,text){
  let last=$('log').lastElementChild;
  if(!last||last.dataset.role!==role){
    last=document.createElement('div');last.className='m '+role;last.dataset.role=role;
    last.innerHTML='<div class="who">'+(role==='agent'?'Interviewer':'You')+'</div><div class="t"></div>';
    $('log').appendChild(last);
  }
  last.querySelector('.t').textContent+=text;$('log').scrollTop=1e9;
}
function stopPlayback(){sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[];nextT=0}
function play(buf){
  const i16=new Int16Array(buf),f=new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
  const ab=outCtx.createBuffer(1,f.length,24000);ab.copyToChannel(f,0);
  const src=outCtx.createBufferSource();src.buffer=ab;src.connect(outCtx.destination);
  const t=Math.max(outCtx.currentTime+0.02,nextT);src.start(t);nextT=t+ab.duration;
  sources.push(src);src.onended=()=>{sources=sources.filter(x=>x!==src)};
}
function pct(a,p){const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*s.length))]}
function recordLatency(ms){
  lats.push(ms);$('lat').textContent=Math.round(ms)+' ms';$('n').textContent=lats.length;
  $('med').textContent=Math.round(pct(lats,.5))+' ms';$('p95').textContent=Math.round(pct(lats,.95))+' ms';
}

const worklet=`class P extends AudioWorkletProcessor{
 process(i){const c=i[0][0];if(c){this.port.postMessage(c.slice(0))}return true}}
 registerProcessor('p',P)`;

async function start(){
  $('start').disabled=true;setStatus('connecting...');ending=false;fbStarted=false;closed=false;
  stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  micCtx=new AudioContext({sampleRate:16000});outCtx=new AudioContext({sampleRate:24000});
  await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet],{type:'application/javascript'})));
  const src=micCtx.createMediaStreamSource(stream);node=new AudioWorkletNode(micCtx,'p');src.connect(node);
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.binaryType='arraybuffer';
  ws.onopen=()=>ws.send(JSON.stringify({type:'start',resume:$('resume').value,jd:$('jd').value}));
  let buf=[],len=0;
  node.port.onmessage=e=>{
    const c=e.data;let sum=0;for(let i=0;i<c.length;i++)sum+=c[i]*c[i];
    const rms=Math.sqrt(sum/c.length);$('lvl').style.width=Math.min(100,rms*600)+'%';
    if(rms>SPEECH_RMS){lastSpeech=performance.now();awaiting=true}
    if(ending||!ws||ws.readyState!==1)return;
    const i16=new Int16Array(c.length);for(let i=0;i<c.length;i++)i16[i]=Math.max(-1,Math.min(1,c[i]))*32767;
    buf.push(i16);len+=i16.length;
    if(len>=1600){ // 100 ms @16k
      const out=new Int16Array(len);let o=0;for(const b of buf){out.set(b,o);o+=b.length}
      ws.send(out.buffer);buf=[];len=0;
    }
  };
  ws.onmessage=ev=>{
    if(ev.data instanceof ArrayBuffer){
      if(awaiting){ // first agent audio after user's last speech => turn latency
        const ms=performance.now()-lastSpeech;if(ms<15000)recordLatency(ms);awaiting=false;
      }
      if(ending)fbStarted=true;
      play(ev.data);return;
    }
    const m=JSON.parse(ev.data);
    if(m.type==='ready'){setStatus('live','on');$('end').disabled=false;$('stop').disabled=false}
    else if(m.type==='user')add('user',m.text);
    else if(m.type==='agent'){if(ending)fbStarted=true;add('agent',m.text)}
    else if(m.type==='turn_complete'){if(ending&&fbStarted)shutdown(true)}
    else if(m.type==='interrupted')stopPlayback();
    else if(m.type==='error'){setStatus('error','err');add('agent','[error] '+m.text)}
  };
  ws.onclose=()=>shutdown(false);
}
// ---- resume / JD inputs: upload or paste, remembered in this browser only ----
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function validate(){
  const ok=$('resume').value.trim().length>=30&&$('jd').value.trim().length>=30;
  if(!ws||ws.readyState>1)$('start').disabled=!ok;
}
for(const [ta,file,hint] of [['resume','resumeFile','resumeHint'],['jd','jdFile','jdHint']]){
  $(ta).value=load('vmi_'+ta);
  $(ta).oninput=()=>{store('vmi_'+ta,$(ta).value);validate()};
  $(file).onchange=async()=>{
    const f=$(file).files[0];if(!f)return;
    $(hint).textContent='Reading '+f.name+'...';
    const fd=new FormData();fd.append('file',f);
    try{
      const r=await fetch('/api/extract',{method:'POST',body:fd});
      const j=await r.json();
      if(!r.ok)throw new Error(j.detail||r.statusText);
      $(ta).value=j.text;store('vmi_'+ta,j.text);
      $(hint).textContent=f.name+' loaded ('+j.text.length+' chars)'+(j.truncated?', truncated to 20,000':'')+'. You can edit the text.';
    }catch(e){$(hint).textContent='Error: '+e.message}
    validate();
  };
}
validate();
$('start').onclick=()=>start().catch(e=>{setStatus('error','err');add('agent','[error] '+e);validate()});
function shutdown(drain){
  if(closed)return;closed=true;clearTimeout(endTimer);
  try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{node&&node.disconnect()}catch(e){}
  try{micCtx&&micCtx.close()}catch(e){}
  try{ws&&ws.readyState<2&&ws.close()}catch(e){}
  const wait=drain&&outCtx?Math.max(0,(nextT-outCtx.currentTime)*1000)+400:0;
  setTimeout(()=>{try{outCtx&&outCtx.close()}catch(e){};stopPlayback()},wait);
  $('lvl').style.width='0';validate();$('end').disabled=true;$('stop').disabled=true;
  setStatus('ended');
}
$('end').onclick=()=>{
  ending=true;fbStarted=false;ws.send(JSON.stringify({type:'end'}));
  $('end').disabled=true;setStatus('feedback...','on');
  endTimer=setTimeout(()=>shutdown(true),90000); // safety net
};
$('stop').onclick=()=>{stopPlayback();shutdown(false)};
</script></body></html>
